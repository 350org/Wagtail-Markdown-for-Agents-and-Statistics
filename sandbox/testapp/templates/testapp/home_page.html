{% load wagtailcore_tags %}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ page.title }}</title></head>
<body>
<h1>{{ page.title }}</h1>
<ul>
  {% for child in page.get_children.live %}
  <li><a href="{% pageurl child %}">{{ child.title }}</a></li>
  {% endfor %}
</ul>
</body>
</html>
