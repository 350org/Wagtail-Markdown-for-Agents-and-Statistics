[tox]
env_list =
    py311-dj42-wagtail63
    py312-dj52-wagtail7
    py313-dj52-wagtail70
    py313-dj52-wagtail7
    py313-dj60-wagtail74
    lint

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.3
    pytest-django>=4.9
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    wagtail63: wagtail>=6.3,<6.4
    wagtail70: wagtail>=7.0,<7.1
    wagtail7: wagtail>=7.0,<8
    wagtail74: wagtail>=7.4,<8
commands = pytest {posargs}

[testenv:lint]
skip_install = true
deps = ruff>=0.8
commands =
    ruff check .
    ruff format --check .
