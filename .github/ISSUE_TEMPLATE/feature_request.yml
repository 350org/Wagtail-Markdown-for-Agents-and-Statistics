name: Feature request
description: Propose an enhancement
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
  - type: textarea
    attributes:
      label: WordPress plugin parity?
      description: If the WordPress original has this feature, link to how it behaves there.
