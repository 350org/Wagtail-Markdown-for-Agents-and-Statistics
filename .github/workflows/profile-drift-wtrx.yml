name: 350.org profile drift

# Checks the 350.org site profile (src/wagtail_markdown_agents/profiles/wtrx)
# against the site's public repository. On demand only: it is not part of the
# package's CI and is specific to that one profile. Remove this file with the
# profile. Other sites run scripts/profile_drift.py against their own source.
on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: "wagtail-wtr-350 ref to inspect (branch, tag or commit)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: 350org/wagtail-wtr-350
          ref: ${{ inputs.site_ref }}
          path: site
          persist-credentials: false
      - name: Record source revisions
        run: |
          git rev-parse HEAD
          git -C site rev-parse HEAD
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install the package and the site's dependencies
        # The versions the snapshot was taken with; the site supplies the rest.
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python . ./site \
            Django==5.2.18 wagtail==7.4.3 wagtail-localize==1.14.5 wagtailmedia==0.19.1
          uv pip freeze --python .venv/bin/python
      - name: Compare block definitions and renderer coverage
        run: >-
          .venv/bin/python scripts/profile_drift.py site
          --settings wagtail_wtr.settings.base
          --profile wagtail_markdown_agents.profiles.wtrx
